<body id="p-error">
  <canvas id='c'></canvas>

  <!-- section: Error -->
  <section class="full-screen">
    <div class="error-content">
      <div class="error">
        <div class="number">4</div>
        <div id="blackhole-content">
          <div id="blackhole-img">
            <picture>
              <source srcset="404-assets/img/blackhole.webp" type="image/webp">
              <source srcset="404-assets/img/blackhole.png" type="image/png">
              <img src="404-assets/img/blackhole.png" alt="Black Hole">
            </picture>
          </div>
        </div>
        <div class="number">4</div>
      </div>
      <div class="text">
        <h1>Page has been eaten by Black Hole!</h1>
        <p>The link may be broken or the page may be removed.</p>
      </div>
      <div class="link-content">
        <a class="btn btn-outline-primary" href="/index.html" role="button">RETURN TO HOME</a>
      </div>
    </div>
  </section>

  <!-- jQuery first, then JS. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
  <script src="404-assets/js/script-error.js"></script>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const isAuth = !!localStorage.getItem('auth_token');
            document.querySelectorAll('.auth-hidden').forEach(el => el.classList.toggle('hidden', isAuth));
            document.querySelectorAll('.auth-visible').forEach(el => el.classList.toggle('hidden', !isAuth));
        });
        if (typeof logout === 'undefined') {
            window.logout = function() {
                localStorage.removeItem('auth_token');
                window.location.href = '/login.html';
            }
        }
    </script>

</body>
