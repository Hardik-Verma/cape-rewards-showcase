<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CAPEVERSE</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { obsidian: '#000000' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        body { background-color: #030303; color: #ffffff; overflow-x: hidden; font-family: 'Inter', sans-serif; }
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: #030303; overflow: hidden; }
        .stars-layer1 {
            width: 1px; height: 1px; background: transparent;
            box-shadow: 10vw 20vh #fff, 30vw 40vh #fff, 50vw 10vh #fff, 70vw 80vh #fff, 90vw 30vh #fff, 20vw 60vh #fff, 80vw 50vh #fff, 40vw 90vh #fff, 60vw 70vh #fff;
            animation: animStar 50s linear infinite;
        }
        @keyframes animStar { from { transform: translateY(-100vh); } to { transform: translateY(100vh); } }
        .nav-glass { background: rgba(5, 5, 5, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .glass-panel { background: #0a0a0a; border-radius: calc(1rem - 1px) !important; position: relative; z-index: 2; }
        .glow-border {
            position: relative; border-radius: 1rem !important; overflow: hidden; padding: 1px; box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.5); z-index: 1; background: rgba(255, 255, 255, 0.05);
        }
        .glow-border::before {
            content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: conic-gradient(from 0deg, transparent 70%, #dc2626 100%); animation: rotate-border 4s linear infinite; z-index: -1;
        }
        @keyframes rotate-border { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex flex-col min-h-screen bg-[#030303]">
    <div class="stars">
        <div class="stars-layer1" style="width: 2px; height: 2px; box-shadow: 10vw 10vh #fff, 20vw 20vh #fff, 30vw 30vh #fff, 40vw 40vh #fff, 50vw 50vh #fff, 60vw 60vh #fff, 70vw 70vh #fff, 80vw 80vh #fff, 90vw 90vh #fff, 15vw 85vh #fff, 25vw 75vh #fff, 35vw 65vh #fff, 45vw 55vh #fff, 55vw 45vh #fff, 65vw 35vh #fff, 75vw 25vh #fff, 85vw 15vh #fff, 95vw 5vh #fff;"></div>
    </div>

    <nav class="nav-glass fixed w-full top-0 z-50 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex-shrink-0 flex items-center">
                    <a href="/index.html" class="flex items-center gap-3">
                        <img src="/logo.png" alt="Logo" class="h-9">
                        <span class="text-white font-bold text-lg tracking-[0.2em] uppercase pt-0.5">CAPEVERSE</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center pt-28 pb-12 px-4 z-20 w-full">
        <div class="glow-border w-full max-w-md">
            <div class="glass-panel w-full p-8 relative flex flex-col gap-6 bg-[#0a0a0a]">
                <div class="text-center">
                    <h2 class="text-3xl font-black uppercase tracking-tighter text-transparent bg-clip-text bg-gradient-to-b from-white to-gray-500 mb-2">Create Account</h2>
                    <p class="text-xs tracking-widest uppercase text-gray-500 font-semibold">Join Capeverse to start earning</p>
                </div>

                <div id="error-msg" class="hidden bg-red-500/10 border border-red-500/20 text-red-400 text-xs font-bold uppercase tracking-widest p-3 rounded-lg text-center"></div>

                <form id="register-form" class="flex flex-col gap-4">
                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] text-gray-500 uppercase tracking-widest font-bold">Username</label>
                        <input type="text" id="username" required class="bg-black/50 border border-white/10 text-white rounded-xl p-3 focus:outline-none focus:border-red-500/50">
                    </div>
                    
                    <div class="flex flex-col gap-1 mb-2">
                        <label class="text-[10px] text-gray-500 uppercase tracking-widest font-bold">Password</label>
                        <input type="password" id="password" required class="bg-black/50 border border-white/10 text-white rounded-xl p-3 focus:outline-none focus:border-red-500/50">
                    </div>

                    <button type="submit" class="bg-white text-black hover:bg-gray-200 font-bold py-3 px-6 rounded-xl tracking-wide uppercase text-xs transition-colors duration-300">
                        Register
                    </button>
                </form>

                <div class="text-center text-xs text-gray-500 uppercase tracking-widest font-semibold mt-2">
                    Already have an account? <a href="/login.html" class="text-white hover:text-red-400 transition-colors">Login</a>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            
            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    alert('Registration successful! Please login.');
                    window.location.href = '/login.html';
                } else {
                    errorMsg.innerText = data.error;
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.innerText = 'Network error. Try again.';
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
