<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CAPEVERSE</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client?onload=initGoogleAuth" async defer></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { obsidian: '#000000' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        body { background-color: #030303; color: #ffffff; overflow-x: hidden; font-family: 'Inter', sans-serif; }
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: #030303; overflow: hidden; }
        .stars-layer1 {
            width: 1px; height: 1px; background: transparent;
            box-shadow: 10vw 20vh #fff, 30vw 40vh #fff, 50vw 10vh #fff, 70vw 80vh #fff, 90vw 30vh #fff, 20vw 60vh #fff, 80vw 50vh #fff, 40vw 90vh #fff, 60vw 70vh #fff;
            animation: animStar 50s linear infinite;
        }
        @keyframes animStar { from { transform: translateY(-100vh); } to { transform: translateY(100vh); } }
        .glass-panel { 
            background: rgba(10, 10, 10, 0.7); 
            backdrop-filter: blur(20px);
            border-radius: calc(1rem - 1px) !important; 
            position: relative; 
            z-index: 2; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 0 40px rgba(220, 38, 38, 0.08), inset 0 0 20px rgba(255, 255, 255, 0.02);
            transition: box-shadow 0.3s ease;
        }
        .glass-panel:hover {
            box-shadow: 0 0 60px rgba(220, 38, 38, 0.15), inset 0 0 30px rgba(255, 255, 255, 0.03);
        }
        .ambient-orb {
            position: fixed;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80vw; height: 80vw; max-width: 800px; max-height: 800px;
            background: radial-gradient(circle, rgba(220,38,38,0.12) 0%, rgba(0,0,0,0) 60%);
            z-index: -1; pointer-events: none;
            animation: pulse-orb 8s ease-in-out infinite alternate;
        }
        @keyframes pulse-orb {
            0% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.9); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }
    </style>
</head>
<body class="flex flex-col min-h-screen bg-[#030303] items-center justify-center p-4">

    <div class="ambient-orb"></div>
    <div class="stars"><div class="stars-layer1" style="width: 2px; height: 2px; box-shadow: 10vw 10vh #fff, 20vw 20vh #fff, 30vw 30vh #fff, 40vw 40vh #fff, 50vw 50vh #fff, 60vw 60vh #fff, 70vw 70vh #fff, 80vw 80vh #fff, 90vw 90vh #fff;"></div></div>

    <div class="w-full max-w-md glass-panel p-8">
        <div class="text-center mb-8">
            <a href="/index.html" class="inline-flex items-center justify-center gap-3 mb-6">
                <span class="text-red-500 font-black text-2xl tracking-[0.3em] uppercase pt-0.5" style="text-shadow: 0 0 20px rgba(220, 38, 38, 0.5);">CAPEVERSE<span class="text-white">.</span></span>
            </a>
            <h1 class="text-2xl font-black uppercase tracking-widest text-transparent bg-clip-text bg-gradient-to-b from-white to-gray-500 mb-2">SECURE YOUR ARSENAL</h1>
            <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-4">Join the exclusive network and dominate.</p>
            <a href="/index.html" class="text-xs font-bold uppercase tracking-widest text-gray-400 hover:text-red-500 transition-colors inline-flex items-center gap-1">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg> Go Back Home
            </a>
        </div>

        <div id="google-btn-container" class="w-full flex justify-center mb-6">
            <!-- Google Sign-In button will render here -->
        </div>

        <div class="flex items-center gap-4 mb-6">
            <div class="h-px bg-white/10 flex-grow"></div>
            <span class="text-xs text-gray-500 font-bold uppercase tracking-widest">OR EMAIL</span>
            <div class="h-px bg-white/10 flex-grow"></div>
        </div>

        <form id="register-form" class="space-y-4">
            <div>
                <label class="block text-[10px] text-gray-500 uppercase tracking-widest font-bold mb-1">Username</label>
                <input type="text" id="username" required class="w-full bg-black/50 border border-white/10 text-white text-sm rounded-xl p-3 focus:outline-none focus:border-red-500/50 transition-colors" placeholder="e.g. venomslayer">
            </div>
            
            <div>
                <label class="block text-[10px] text-gray-500 uppercase tracking-widest font-bold mb-1">Email</label>
                <input type="email" id="email" required class="w-full bg-black/50 border border-white/10 text-white text-sm rounded-xl p-3 focus:outline-none focus:border-red-500/50 transition-colors" placeholder="you@example.com">
            </div>

            <div id="password-group" class="hidden">
                <label class="block text-[10px] text-gray-500 uppercase tracking-widest font-bold mb-1">Password</label>
                <input type="password" id="password" class="w-full bg-black/50 border border-white/10 text-white text-sm rounded-xl p-3 focus:outline-none focus:border-red-500/50 transition-colors" placeholder="••••••••">
            </div>

            <div id="otp-group" class="hidden">
                <label class="block text-[10px] text-gray-500 uppercase tracking-widest font-bold mb-1">Verification Code</label>
                <input type="text" id="otp" class="w-full bg-black/50 border border-white/10 text-white text-sm rounded-xl p-3 focus:outline-none focus:border-emerald-500/50 transition-colors" placeholder="6-Digit Code">
                <p class="text-[10px] text-gray-500 mt-2">Check your email for the code (also check spam).</p>
            </div>

            <div id="error-msg" class="text-red-500 text-xs font-bold text-center uppercase tracking-widest hidden"></div>
            <div id="success-msg" class="text-emerald-500 text-xs font-bold text-center uppercase tracking-widest hidden"></div>

            <button type="button" id="send-otp-btn" class="w-full bg-white text-black font-black uppercase tracking-widest text-sm p-4 rounded-xl hover:bg-gray-200 transition-colors">
                Send Verification Code
            </button>

            <button type="submit" id="register-btn" class="w-full bg-emerald-500 text-black font-black uppercase tracking-widest text-sm p-4 rounded-xl hover:bg-emerald-400 transition-colors hidden">
                Complete Registration
            </button>
            <button type="button" id="resend-otp-btn" class="w-full bg-transparent border border-white/10 text-gray-500 font-bold uppercase tracking-widest text-xs p-3 rounded-xl hover:text-white hover:border-white/30 transition-colors hidden" disabled>
                Resend Code (30s)
            </button>
        </form>

        <div class="mt-8 text-center">
            <p class="text-xs text-gray-500 font-bold uppercase tracking-widest">
                Already have an account? <a href="/login.html" class="text-white hover:text-red-500 transition-colors">Log In</a>
            </p>
        </div>
    </div>

    <script>
        // Check config to init Google Auth
        function initGoogleAuth() {
            if (window.GOOGLE_CLIENT_ID) {
                google.accounts.id.initialize({
                    client_id: window.GOOGLE_CLIENT_ID,
                    callback: handleGoogleLogin
                });
                google.accounts.id.renderButton(
                    document.getElementById("google-btn-container"),
                    { theme: "outline", size: "large", text: "signup_with" }
                );
            }
        }

        async function handleGoogleLogin(response) {
            const res = await fetch('/api/auth/google', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ credential: response.credential })
            });
            const data = await res.json();
            if (data.success) {
                localStorage.setItem('auth_token', data.token);
                window.location.href = data.role === 'admin' ? '/admin.html' : '/claim.html';
            } else {
                document.getElementById('error-msg').innerText = data.error;
                document.getElementById('error-msg').classList.remove('hidden');
            }
        }

        const sendOtpBtn = document.getElementById('send-otp-btn');
        const form = document.getElementById('register-form');
        
        sendOtpBtn.addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            if (!email) return alert('Enter email first');

            sendOtpBtn.disabled = true;
            sendOtpBtn.innerText = 'Sending...';

            try {
                const res = await fetch('/api/auth/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                
                if (data.success) {
                    document.getElementById('success-msg').innerText = 'OTP Sent! Check your email.';
                    document.getElementById('success-msg').classList.remove('hidden');
                    document.getElementById('error-msg').classList.add('hidden');
                    
                    sendOtpBtn.classList.add('hidden');
                    document.getElementById('password-group').classList.remove('hidden');
                    document.getElementById('otp-group').classList.remove('hidden');
                    document.getElementById('register-btn').classList.remove('hidden');
                    document.getElementById('resend-otp-btn').classList.remove('hidden');
                    startResendTimer(30);
                } else {
                    sendOtpBtn.disabled = false;
                    sendOtpBtn.innerText = 'Send Verification Code';
                    document.getElementById('error-msg').innerText = data.error;
                    document.getElementById('error-msg').classList.remove('hidden');
                }
            } catch (err) {
                sendOtpBtn.disabled = false;
                sendOtpBtn.innerText = 'Send Verification Code';
                document.getElementById('error-msg').innerText = 'Network error. Please try again.';
                document.getElementById('error-msg').classList.remove('hidden');
            }
        });

        let resendInterval;
        function startResendTimer(seconds) {
            const resendBtn = document.getElementById('resend-otp-btn');
            resendBtn.disabled = true;
            let timeLeft = seconds;
            resendBtn.innerText = `Resend Code (${timeLeft}s)`;
            
            clearInterval(resendInterval);
            resendInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(resendInterval);
                    resendBtn.disabled = false;
                    resendBtn.innerText = 'Resend Code';
                } else {
                    resendBtn.innerText = `Resend Code (${timeLeft}s)`;
                }
            }, 1000);
        }

        document.getElementById('resend-otp-btn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            if (!email) return;

            const resendBtn = document.getElementById('resend-otp-btn');
            resendBtn.disabled = true;
            resendBtn.innerText = 'Sending...';

            try {
                const res = await fetch('/api/auth/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                
                if (data.success) {
                    document.getElementById('success-msg').innerText = 'New Code Sent! Check your email.';
                    document.getElementById('success-msg').classList.remove('hidden');
                    document.getElementById('error-msg').classList.add('hidden');
                    startResendTimer(30);
                } else {
                    resendBtn.disabled = false;
                    resendBtn.innerText = 'Resend Code';
                    document.getElementById('error-msg').innerText = data.error;
                    document.getElementById('error-msg').classList.remove('hidden');
                }
            } catch (err) {
                resendBtn.disabled = false;
                resendBtn.innerText = 'Resend Code';
                document.getElementById('error-msg').innerText = 'Network error. Please try again.';
                document.getElementById('error-msg').classList.remove('hidden');
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const otp = document.getElementById('otp').value;

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password, otp })
            });

            const data = await res.json();
            if (data.success) {
                // Auto login or redirect
                alert('Account created! Please log in.');
                window.location.href = '/login.html';
            } else {
                document.getElementById('error-msg').innerText = data.error;
                document.getElementById('error-msg').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
