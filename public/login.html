<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CAPEVERSE</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client?onload=initGoogleAuth" async defer></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { obsidian: '#000000' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        body { background-color: #030303; color: #ffffff; overflow-x: hidden; font-family: 'Inter', sans-serif; }
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: #030303; overflow: hidden; }
        .stars-layer1 {
            width: 1px; height: 1px; background: transparent;
            box-shadow: 10vw 20vh #fff, 30vw 40vh #fff, 50vw 10vh #fff, 70vw 80vh #fff, 90vw 30vh #fff, 20vw 60vh #fff, 80vw 50vh #fff, 40vw 90vh #fff, 60vw 70vh #fff;
            animation: animStar 50s linear infinite;
        }
        @keyframes animStar { from { transform: translateY(-100vh); } to { transform: translateY(100vh); } }
        .glass-panel { background: #0a0a0a; border-radius: calc(1rem - 1px) !important; position: relative; z-index: 2; border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="flex flex-col min-h-screen bg-[#030303] items-center justify-center p-4">

    <div class="stars"><div class="stars-layer1" style="width: 2px; height: 2px; box-shadow: 10vw 10vh #fff, 20vw 20vh #fff, 30vw 30vh #fff, 40vw 40vh #fff, 50vw 50vh #fff, 60vw 60vh #fff, 70vw 70vh #fff, 80vw 80vh #fff, 90vw 90vh #fff;"></div></div>

    <div class="w-full max-w-md glass-panel p-8">
        <div class="text-center mb-8">
            <a href="/index.html" class="inline-flex items-center justify-center gap-3 mb-6">
                <img src="/logo.png" alt="Logo" class="h-10">
                <span class="text-white font-black text-xl tracking-[0.2em] uppercase pt-0.5">CAPEVERSE</span>
            </a>
            <h1 class="text-2xl font-black uppercase tracking-widest text-transparent bg-clip-text bg-gradient-to-b from-white to-gray-500 mb-2">Welcome Back</h1>
            <p class="text-xs text-gray-500 font-bold uppercase tracking-widest mb-4">Sign in to claim your rewards.</p>
            <a href="/index.html" class="text-xs font-bold uppercase tracking-widest text-gray-400 hover:text-red-500 transition-colors inline-flex items-center gap-1">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg> Go Back Home
            </a>
        </div>

        <div id="google-btn-container" class="w-full flex justify-center mb-6">
            <!-- Google Sign-In button will render here -->
        </div>

        <div class="flex items-center gap-4 mb-6">
            <div class="h-px bg-white/10 flex-grow"></div>
            <span class="text-xs text-gray-500 font-bold uppercase tracking-widest">OR LOGIN WITH EMAIL</span>
            <div class="h-px bg-white/10 flex-grow"></div>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-[10px] text-gray-500 uppercase tracking-widest font-bold mb-1">Username or Email</label>
                <input type="text" id="identifier" required class="w-full bg-black/50 border border-white/10 text-white text-sm rounded-xl p-3 focus:outline-none focus:border-red-500/50 transition-colors" placeholder="e.g. venomslayer">
            </div>
            
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-[10px] text-gray-500 uppercase tracking-widest font-bold">Password</label>
                    <a href="/forgot-password.html" class="text-[10px] text-gray-400 hover:text-red-500 transition-colors font-bold uppercase tracking-widest">Forgot Password?</a>
                </div>
                <input type="password" id="password" required class="w-full bg-black/50 border border-white/10 text-white text-sm rounded-xl p-3 focus:outline-none focus:border-red-500/50 transition-colors" placeholder="••••••••">
            </div>

            <div id="error-msg" class="text-red-500 text-xs font-bold text-center uppercase tracking-widest hidden"></div>

            <button type="submit" class="w-full bg-white text-black font-black uppercase tracking-widest text-sm p-4 rounded-xl hover:bg-gray-200 transition-colors">
                Log In
            </button>
        </form>

        <div class="mt-8 text-center">
            <p class="text-xs text-gray-500 font-bold uppercase tracking-widest">
                Don't have an account? <a href="/register.html" class="text-white hover:text-red-500 transition-colors">Sign Up</a>
            </p>
        </div>
    </div>

    <script>
        function initGoogleAuth() {
            if (window.GOOGLE_CLIENT_ID) {
                google.accounts.id.initialize({
                    client_id: window.GOOGLE_CLIENT_ID,
                    callback: handleGoogleLogin
                });
                google.accounts.id.renderButton(
                    document.getElementById("google-btn-container"),
                    { theme: "filled_black", size: "large", text: "signin_with" }
                );
            }
        }

        async function handleGoogleLogin(response) {
            const res = await fetch('/api/auth/google', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ credential: response.credential })
            });
            const data = await res.json();
            if (data.success) {
                localStorage.setItem('auth_token', data.token);
                window.location.href = data.role === 'admin' ? '/admin.html' : '/claim.html';
            } else {
                document.getElementById('error-msg').innerText = data.error;
                document.getElementById('error-msg').classList.remove('hidden');
            }
        }

        const form = document.getElementById('login-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const identifier = document.getElementById('identifier').value;
            const password = document.getElementById('password').value;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier, password })
            });

            const data = await res.json();
            if (data.success) {
                localStorage.setItem('auth_token', data.token);
                window.location.href = data.role === 'admin' ? '/admin.html' : '/claim.html';
            } else {
                document.getElementById('error-msg').innerText = data.error;
                document.getElementById('error-msg').classList.remove('hidden');
            }
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const isAuth = !!localStorage.getItem('auth_token');
            document.querySelectorAll('.auth-hidden').forEach(el => { el.style.display = isAuth ? 'none' : 'block'; });
            document.querySelectorAll('.auth-visible').forEach(el => { el.style.display = isAuth ? 'block' : 'none'; el.classList.remove('hidden'); });
        });
        if (typeof logout === 'undefined') {
            window.logout = function() {
                localStorage.removeItem('auth_token');
                window.location.href = '/login.html';
            }
        }
    </script>

</body>
</html>
