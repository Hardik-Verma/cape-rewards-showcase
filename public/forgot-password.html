<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | CAPEVERSE</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { obsidian: '#000000' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        body { background-color: #030303; color: #ffffff; overflow-x: hidden; font-family: 'Inter', sans-serif; }
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: #030303; overflow: hidden; }
        .stars-layer1 {
            width: 1px; height: 1px; background: transparent;
            box-shadow: 10vw 20vh #fff, 30vw 40vh #fff, 50vw 10vh #fff, 70vw 80vh #fff, 90vw 30vh #fff, 20vw 60vh #fff, 80vw 50vh #fff, 40vw 90vh #fff, 60vw 70vh #fff;
            animation: animStar 50s linear infinite;
        }
        @keyframes animStar { from { transform: translateY(-100vh); } to { transform: translateY(100vh); } }
        .glass-panel { background: #0a0a0a; border-radius: calc(1rem - 1px) !important; position: relative; z-index: 2; border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="flex flex-col min-h-screen bg-[#030303] items-center justify-center p-4">

    <div class="stars"><div class="stars-layer1" style="width: 2px; height: 2px; box-shadow: 10vw 10vh #fff, 20vw 20vh #fff, 30vw 30vh #fff, 40vw 40vh #fff, 50vw 50vh #fff, 60vw 60vh #fff, 70vw 70vh #fff, 80vw 80vh #fff, 90vw 90vh #fff;"></div></div>

    <div class="w-full max-w-md glass-panel p-8">
        <div class="text-center mb-8">
            <a href="/index.html" class="inline-flex items-center justify-center gap-3 mb-6">
                <img src="/logo.png" alt="Logo" class="h-10">
                <span class="text-white font-black text-xl tracking-[0.2em] uppercase pt-0.5">CAPEVERSE</span>
            </a>
            <h1 class="text-2xl font-black uppercase tracking-widest text-transparent bg-clip-text bg-gradient-to-b from-white to-gray-500 mb-2">Reset Password</h1>
            <p class="text-xs text-gray-500 font-bold uppercase tracking-widest mb-4">Enter your email to receive a reset code.</p>
            <a href="/login.html" class="text-xs font-bold uppercase tracking-widest text-gray-400 hover:text-red-500 transition-colors inline-flex items-center gap-1">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg> Back to Login
            </a>
        </div>

        <!-- Step 1: Request OTP -->
        <form id="request-form" class="space-y-4">
            <div>
                <label class="block text-[10px] text-gray-500 uppercase tracking-widest font-bold mb-1">Email Address</label>
                <input type="email" id="email" required class="w-full bg-black/50 border border-white/10 text-white text-sm rounded-xl p-3 focus:outline-none focus:border-red-500/50 transition-colors" placeholder="your@email.com">
            </div>

            <div id="request-error" class="text-red-500 text-xs font-bold text-center uppercase tracking-widest hidden"></div>

            <button type="submit" id="request-btn" class="w-full bg-white text-black font-black uppercase tracking-widest text-sm p-4 rounded-xl hover:bg-gray-200 transition-colors">
                Send Reset Code
            </button>
        </form>

        <!-- Step 2: Reset Password (Hidden Initially) -->
        <form id="reset-form" class="space-y-4 hidden">
            <div>
                <label class="block text-[10px] text-gray-500 uppercase tracking-widest font-bold mb-1">Verification Code</label>
                <input type="text" id="otp" required class="w-full bg-black/50 border border-white/10 text-white text-sm rounded-xl p-3 focus:outline-none focus:border-red-500/50 transition-colors" placeholder="123456" maxlength="6">
            </div>

            <div>
                <label class="block text-[10px] text-gray-500 uppercase tracking-widest font-bold mb-1">New Password</label>
                <input type="password" id="new-password" required class="w-full bg-black/50 border border-white/10 text-white text-sm rounded-xl p-3 focus:outline-none focus:border-red-500/50 transition-colors" placeholder="••••••••">
            </div>

            <div id="reset-error" class="text-red-500 text-xs font-bold text-center uppercase tracking-widest hidden"></div>

            <button type="submit" id="reset-btn" class="w-full bg-red-500 text-white font-black uppercase tracking-widest text-sm p-4 rounded-xl hover:bg-red-600 transition-colors">
                Set New Password
            </button>
            <button type="button" id="resend-otp-btn" class="w-full bg-transparent border border-white/10 text-gray-500 font-bold uppercase tracking-widest text-xs p-3 rounded-xl hover:text-white hover:border-white/30 transition-colors mt-2" disabled>
                Resend Code (30s)
            </button>
        </form>
    </div>

    <script>
        const requestForm = document.getElementById('request-form');
        const resetForm = document.getElementById('reset-form');
        const requestBtn = document.getElementById('request-btn');
        const resetBtn = document.getElementById('reset-btn');
        let currentEmail = '';

        requestForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            currentEmail = document.getElementById('email').value;
            requestBtn.disabled = true;
            requestBtn.innerText = 'Sending...';

            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail })
                });
                const data = await res.json();
                
                if (data.success) {
                    requestForm.classList.add('hidden');
                    resetForm.classList.remove('hidden');
                    document.querySelector('.text-gray-500.mb-4').innerText = 'Enter the code sent to your email and your new password.';
                    startResendTimer(30);
                } else {
                    requestBtn.disabled = false;
                    requestBtn.innerText = 'Send Reset Code';
                    const err = document.getElementById('request-error');
                    err.innerText = data.error;
                    err.classList.remove('hidden');
                }
            } catch (err) {
                requestBtn.disabled = false;
                requestBtn.innerText = 'Send Reset Code';
                const errorEl = document.getElementById('request-error');
                errorEl.innerText = 'Network error. Please try again.';
                errorEl.classList.remove('hidden');
            }
        });

        let resendInterval;
        function startResendTimer(seconds) {
            const resendBtn = document.getElementById('resend-otp-btn');
            resendBtn.disabled = true;
            let timeLeft = seconds;
            resendBtn.innerText = `Resend Code (${timeLeft}s)`;
            
            clearInterval(resendInterval);
            resendInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(resendInterval);
                    resendBtn.disabled = false;
                    resendBtn.innerText = 'Resend Code';
                } else {
                    resendBtn.innerText = `Resend Code (${timeLeft}s)`;
                }
            }, 1000);
        }

        document.getElementById('resend-otp-btn').addEventListener('click', async () => {
            const resendBtn = document.getElementById('resend-otp-btn');
            resendBtn.disabled = true;
            resendBtn.innerText = 'Sending...';

            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail })
                });
                const data = await res.json();
                
                if (data.success) {
                    const err = document.getElementById('reset-error');
                    err.classList.add('hidden');
                    startResendTimer(30);
                } else {
                    resendBtn.disabled = false;
                    resendBtn.innerText = 'Resend Code';
                    const err = document.getElementById('reset-error');
                    err.innerText = data.error;
                    err.classList.remove('hidden');
                }
            } catch (err) {
                resendBtn.disabled = false;
                resendBtn.innerText = 'Resend Code';
                const errorEl = document.getElementById('reset-error');
                errorEl.innerText = 'Network error. Please try again.';
                errorEl.classList.remove('hidden');
            }
        });

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const otp = document.getElementById('otp').value;
            const newPassword = document.getElementById('new-password').value;
            resetBtn.disabled = true;
            resetBtn.innerText = 'Updating...';

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, otp, newPassword })
                });
                const data = await res.json();
                
                if (data.success) {
                    window.location.href = '/login.html';
                } else {
                    resetBtn.disabled = false;
                    resetBtn.innerText = 'Set New Password';
                    const err = document.getElementById('reset-error');
                    err.innerText = data.error;
                    err.classList.remove('hidden');
                }
            } catch (err) {
                resetBtn.disabled = false;
                resetBtn.innerText = 'Set New Password';
                const errorEl = document.getElementById('reset-error');
                errorEl.innerText = 'Network error. Please try again.';
                errorEl.classList.remove('hidden');
            }
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const isAuth = !!localStorage.getItem('auth_token');
            document.querySelectorAll('.auth-hidden').forEach(el => { el.style.display = isAuth ? 'none' : 'block'; });
            document.querySelectorAll('.auth-visible').forEach(el => { el.style.display = isAuth ? 'block' : 'none'; el.classList.remove('hidden'); });
        });
        if (typeof logout === 'undefined') {
            window.logout = function() {
                localStorage.removeItem('auth_token');
                window.location.href = '/login.html';
            }
        }
    </script>

</body>
</html>
