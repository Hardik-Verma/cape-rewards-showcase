        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: #030303; overflow: hidden; }

            width: 1px; height: 1px; background: transparent;

        .glass-panel { background: #0a0a0a; border-radius: calc(1rem - 1px) !important; position: relative; z-index: 2; }

        .glow-border::before {

    <main class="flex-grow flex flex-col items-center justify-start pt-28 pb-12 px-4 sm:px-6 lg:px-8 z-20 w-full max-w-4xl mx-auto">
        
        <div class="w-full flex flex-col md:flex-row gap-6 mb-8 items-center justify-between">
            <div class="text-center md:text-left flex items-center gap-4">
                <a href="/claim.html" class="bg-white/5 text-gray-400 hover:text-white p-3 rounded-xl transition-colors hidden md:block">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                </a>
                <div>
                    <h2 class="text-3xl md:text-5xl font-black uppercase tracking-tighter text-transparent bg-clip-text bg-gradient-to-b from-white to-gray-500 mb-2">Order History</h2>
                    <p class="text-sm tracking-widest uppercase text-gray-500 font-semibold">View and manage your past rewards.</p>
                </div>
            </div>
        </div>

        <div class="w-full glow-border mb-8">
            <div class="glass-panel w-full rounded-2xl p-6 relative flex flex-col md:flex-row gap-4 items-center justify-between bg-[#0a0a0a]">
                
                <div class="flex flex-wrap gap-4 w-full justify-center md:justify-start">
                    <!-- Date Filter -->
                    <div class="flex flex-col gap-1 w-full sm:w-auto">
                        <label class="text-[10px] text-gray-500 uppercase tracking-widest font-bold">Filter By Date</label>
                        <select id="filter-date" onchange="renderHistory()" class="bg-black/50 border border-white/10 text-gray-300 text-xs font-bold uppercase tracking-widest rounded-xl p-3 focus:outline-none focus:border-red-500/50 w-full">
                            <option value="all">All Time</option>
                            <option value="today">Today</option>
                            <option value="yesterday">Yesterday</option>
                            <option value="7days">Past 7 Days</option>
                            <option value="30days">Past 30 Days</option>
                        </select>
                    </div>

                    <!-- Sort By -->
                    <div class="flex flex-col gap-1 w-full sm:w-auto">
                        <label class="text-[10px] text-gray-500 uppercase tracking-widest font-bold">Sort By</label>
                        <select id="sort-by" onchange="renderHistory()" class="bg-black/50 border border-white/10 text-gray-300 text-xs font-bold uppercase tracking-widest rounded-xl p-3 focus:outline-none focus:border-red-500/50 w-full">
                            <option value="date">Date</option>
                            <option value="points">Points Spent</option>
                        </select>
                    </div>

                    <!-- Order -->
                    <div class="flex flex-col gap-1 w-full sm:w-auto">
                        <label class="text-[10px] text-gray-500 uppercase tracking-widest font-bold">Order</label>
                        <select id="sort-order" onchange="renderHistory()" class="bg-black/50 border border-white/10 text-gray-300 text-xs font-bold uppercase tracking-widest rounded-xl p-3 focus:outline-none focus:border-red-500/50 w-full">
                            <option value="desc">Descending</option>
                            <option value="asc">Ascending</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="w-full space-y-4" id="history-list">
            <!-- Rendered by JS -->
        </div>

    <!-- Professional Footer -->

                    <p class="text-gray-600 text-xs leading-relaxed max-w-sm mb-6">
                        The premier platform for authenticated digital cosmetics. We pride ourselves on security, speed, and reliability.
                    </p>

                    </div>
                </div>

        </div>

    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());

        const authToken = localStorage.getItem('auth_token');
        if (!authToken) {
            window.location.href = '/login.html';
        }
        
        let serverHistory = [];

        function logout() {
            localStorage.removeItem('auth_token');
            window.location.href = '/login.html';
        }

        function copyKey(btnElement, textToCopy) {
            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalHtml = btnElement.innerHTML;
                btnElement.innerHTML = `<svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Copied!`;
                btnElement.classList.remove('text-gray-400');
                btnElement.classList.add('text-emerald-400');
                
                setTimeout(() => {
                    btnElement.innerHTML = originalHtml;
                    btnElement.classList.add('text-gray-400');
                    btnElement.classList.remove('text-emerald-400');
                }, 2000);
            });
        }

        async function fetchHistory() {
            try {
                const res = await fetch('/api/history', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const data = await res.json();
                
                if (data.success) {
                    serverHistory = data.history;
                    renderHistory();
                } else {
                    if(res.status === 401 || res.status === 403) logout();
                }
            } catch(e) {
                document.getElementById('history-list').innerHTML = '<div class="text-center text-red-500">Failed to load history.</div>';
            }
        }

        function renderHistory() {
            const listEl = document.getElementById('history-list');
            
            if (serverHistory.length === 0) {
                listEl.innerHTML = '<div class="text-center text-gray-500 font-bold tracking-widest uppercase p-12 bg-[#0a0a0a] border border-white/5 rounded-2xl">No past orders found.</div>';
                return;
            }

            let history = [...serverHistory];
            
            // Get filter values
            const filterDate = document.getElementById('filter-date').value;
            const sortBy = document.getElementById('sort-by').value;
            const sortOrder = document.getElementById('sort-order').value;

            // Apply Filters
            const now = Date.now();
            const oneDay = 24 * 60 * 60 * 1000;
            const startOfToday = new Date().setHours(0,0,0,0);
            const startOfYesterday = startOfToday - oneDay;

            history = history.filter(item => {
                const ts = item.timestamp || 0; 
                
                if (filterDate === 'all') return true;
                if (filterDate === 'today') return ts >= startOfToday;
                if (filterDate === 'yesterday') return ts >= startOfYesterday && ts < startOfToday;
                if (filterDate === '7days') return (now - ts) <= (7 * oneDay);
                if (filterDate === '30days') return (now - ts) <= (30 * oneDay);
                return true;
            });

            // Apply Sorting
            history.sort((a, b) => {
                let valA, valB;
                
                if (sortBy === 'points') {
                    valA = parseInt(a.points) || 0;
                    valB = parseInt(b.points) || 0;
                } else {
                    valA = a.timestamp || 0;
                    valB = b.timestamp || 0;
                }

                if (sortOrder === 'asc') {
                    return valA > valB ? 1 : (valA < valB ? -1 : 0);
                } else {
                    return valA < valB ? 1 : (valA > valB ? -1 : 0);
                }
            });

            // Render
            if (history.length === 0) {
                listEl.innerHTML = '<div class="text-center text-gray-500 font-bold tracking-widest uppercase p-12 bg-[#0a0a0a] border border-white/5 rounded-2xl">No orders match these filters.</div>';
                return;
            }

            listEl.innerHTML = history.map(item => `
                <div class="bg-[#0a0a0a] border border-white/5 hover:border-white/10 p-6 rounded-2xl flex flex-col md:flex-row gap-6 items-center transition-colors">
                    <div class="flex-grow text-center md:text-left">
                        <div class="text-white font-black text-xl mb-1">${item.name}</div>
                        <div class="text-gray-500 text-xs font-bold tracking-widest uppercase flex flex-wrap gap-3 justify-center md:justify-start">
                            <span>${item.date}</span>
                            <span class="text-white/20">•</span>
                            <span class="text-emerald-500">${item.points ? item.points + ' PTS' : 'Free'}</span>
                        </div>
                    </div>
                    
                    <div class="w-full md:w-auto flex flex-col items-center md:items-end gap-2">
                        <span class="text-[10px] text-gray-600 uppercase font-bold tracking-widest">Reward Token</span>
                        <div class="flex items-center gap-2 bg-black/50 border border-white/10 px-4 py-3 rounded-xl w-full md:w-auto">
                            <code class="text-emerald-400 font-mono text-sm select-all tracking-wider">${item.token}</code>
                            <button onclick="copyKey(this, '${item.token}')" class="text-gray-400 hover:text-white transition-colors ml-4 flex items-center gap-1 text-xs uppercase tracking-widest font-bold" title="Copy">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchHistory();
            
            const mobileBtn = document.getElementById('mobile-menu-btn');
            const mobileMenu = document.getElementById('mobile-menu');
            if (mobileBtn && mobileMenu) {
                mobileBtn.addEventListener('click', () => {
                    mobileMenu.classList.toggle('hidden');
                });
            }
        });
    </script>
