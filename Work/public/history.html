<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History | CAPEVERSE</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { obsidian: '#000000' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        body { background-color: #030303; color: #ffffff; overflow-x: hidden; font-family: 'Inter', sans-serif; }
        
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: #030303; overflow: hidden; }
        .stars-layer1 {
            width: 1px; height: 1px; background: transparent;
            box-shadow: 10vw 20vh #fff, 30vw 40vh #fff, 50vw 10vh #fff, 70vw 80vh #fff, 90vw 30vh #fff, 20vw 60vh #fff, 80vw 50vh #fff, 40vw 90vh #fff, 60vw 70vh #fff;
            animation: animStar 50s linear infinite;
        }
        @keyframes animStar { from { transform: translateY(-100vh); } to { transform: translateY(100vh); } }

        .nav-glass { background: rgba(5, 5, 5, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }

        .glass-panel { background: #0a0a0a; border-radius: calc(1rem - 1px) !important; position: relative; z-index: 2; }
        .glow-border {
            position: relative; border-radius: 1rem !important; overflow: hidden; padding: 1px; box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.5); z-index: 1; background: rgba(255, 255, 255, 0.05);
        }
        .glow-border::before {
            content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: conic-gradient(from 0deg, transparent 70%, #dc2626 100%); animation: rotate-border 4s linear infinite; z-index: -1;
        }
        @keyframes rotate-border { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex flex-col min-h-screen bg-[#030303]">

    <div class="stars">
        <div class="stars-layer1" style="width: 2px; height: 2px; box-shadow: 10vw 10vh #fff, 20vw 20vh #fff, 30vw 30vh #fff, 40vw 40vh #fff, 50vw 50vh #fff, 60vw 60vh #fff, 70vw 70vh #fff, 80vw 80vh #fff, 90vw 90vh #fff, 15vw 85vh #fff, 25vw 75vh #fff, 35vw 65vh #fff, 45vw 55vh #fff, 55vw 45vh #fff, 65vw 35vh #fff, 75vw 25vh #fff, 85vw 15vh #fff, 95vw 5vh #fff;"></div>
    </div>

    <div id="nav-root"></div>

    <main class="flex-grow flex flex-col items-center justify-start pt-28 pb-12 px-4 sm:px-6 lg:px-8 z-20 w-full max-w-4xl mx-auto">
        
        <div class="w-full flex flex-col md:flex-row gap-6 mb-8 items-center justify-between">
            <div class="text-center md:text-left flex items-center gap-4">
                <a href="/claim.html" class="bg-white/5 text-gray-400 hover:text-white p-3 rounded-xl transition-colors hidden md:block">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                </a>
                <div>
                    <h2 class="text-3xl md:text-5xl font-black uppercase tracking-tighter text-transparent bg-clip-text bg-gradient-to-b from-white to-gray-500 mb-2">Order History</h2>
                    <p class="text-sm tracking-widest uppercase text-gray-500 font-semibold">View and manage your past rewards.</p>
                </div>
            </div>
            <button onclick="deleteAllOrders()" class="bg-red-900/30 hover:bg-red-600 text-red-500 hover:text-white px-6 py-3 rounded-xl font-bold text-xs uppercase tracking-widest transition-all border border-red-900/50 hover:border-red-500">
                Delete All History
            </button>
        </div>

        <div class="w-full glow-border mb-8">
            <div class="glass-panel w-full rounded-2xl p-6 relative flex flex-col md:flex-row gap-4 items-center justify-between bg-[#0a0a0a]">
                
                <div class="flex flex-wrap gap-4 w-full justify-center md:justify-start">
                    <!-- Date Filter -->
                    <div class="flex flex-col gap-1 w-full sm:w-auto">
                        <label class="text-[10px] text-gray-500 uppercase tracking-widest font-bold">Filter By Date</label>
                        <select id="filter-date" onchange="renderHistory()" class="bg-black/50 border border-white/10 text-gray-300 text-xs font-bold uppercase tracking-widest rounded-xl p-3 focus:outline-none focus:border-red-500/50 w-full cursor-pointer hover:bg-white/5 transition-colors">
                            <option value="all" class="bg-[#0a0a0a] text-gray-300 py-1">All Time</option>
                            <option value="today" class="bg-[#0a0a0a] text-gray-300 py-1">Today</option>
                            <option value="yesterday" class="bg-[#0a0a0a] text-gray-300 py-1">Yesterday</option>
                            <option value="7days" class="bg-[#0a0a0a] text-gray-300 py-1">Past 7 Days</option>
                            <option value="30days" class="bg-[#0a0a0a] text-gray-300 py-1">Past 30 Days</option>
                        </select>
                    </div>

                    <!-- Sort By -->
                    <div class="flex flex-col gap-1 w-full sm:w-auto">
                        <label class="text-[10px] text-gray-500 uppercase tracking-widest font-bold">Sort By</label>
                        <select id="sort-by" onchange="renderHistory()" class="bg-black/50 border border-white/10 text-gray-300 text-xs font-bold uppercase tracking-widest rounded-xl p-3 focus:outline-none focus:border-red-500/50 w-full cursor-pointer hover:bg-white/5 transition-colors">
                            <option value="date" class="bg-[#0a0a0a] text-gray-300 py-1">Date</option>
                            <option value="points" class="bg-[#0a0a0a] text-gray-300 py-1">Points Spent</option>
                        </select>
                    </div>

                    <!-- Order -->
                    <div class="flex flex-col gap-1 w-full sm:w-auto">
                        <label class="text-[10px] text-gray-500 uppercase tracking-widest font-bold">Order</label>
                        <select id="sort-order" onchange="renderHistory()" class="bg-black/50 border border-white/10 text-gray-300 text-xs font-bold uppercase tracking-widest rounded-xl p-3 focus:outline-none focus:border-red-500/50 w-full cursor-pointer hover:bg-white/5 transition-colors">
                            <option value="desc" class="bg-[#0a0a0a] text-gray-300 py-1">Descending</option>
                            <option value="asc" class="bg-[#0a0a0a] text-gray-300 py-1">Ascending</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="w-full space-y-4" id="history-list">
            <!-- Rendered by JS -->
        </div>

    </main>

    <!-- Professional Footer -->
    <footer class="w-full py-16 border-t border-white/5 bg-[#030303] relative z-20 mt-auto">
        <div class="max-w-7xl mx-auto px-6 lg:px-8">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-12">
                <div class="col-span-1 md:col-span-2">
                    <div class="flex items-center gap-3 mb-6">
                        <img src="/logo.png" alt="Logo" class="h-8 opacity-80">
                        <span class="text-white font-bold text-base tracking-widest sm:tracking-[0.2em] uppercase pt-0.5">CAPEVERSE</span>
                    </div>
                    <p class="text-gray-600 text-xs leading-relaxed max-w-sm mb-6">
                        The premier platform for authenticated digital cosmetics. We pride ourselves on security, speed, and reliability.
                    </p>
                    <div class="text-gray-700 text-[10px] uppercase tracking-widest">
                        &copy; 2026 CAPEVERSE. All Rights Reserved.
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());

        const authToken = localStorage.getItem('auth_token');
        if (!authToken) {
            window.location.href = '/preview.html';
        }
        
        let serverHistory = [];
        let inviteLink = 'https://discord.gg/tgCFxYD948';
        fetch('/api/config').then(r => r.json()).then(cfg => {
            if (cfg.discordInviteLink) inviteLink = cfg.discordInviteLink;
        }).catch(() => {});

        async function deleteOrder(id) {
            if (!confirm('Are you sure you want to delete this order? This action cannot be undone.')) return;
            
            try {
                const res = await fetch(`/api/history/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const data = await res.json();
                if (data.success) {
                    fetchHistory();
                } else {
                    alert('Failed to delete order.');
                }
            } catch (e) {
                alert('Error deleting order.');
            }
        }

        async function deleteAllOrders() {
            if (!confirm('WARNING: Are you sure you want to delete ALL order history? This action cannot be undone!')) return;
            
            try {
                const res = await fetch('/api/history', {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const data = await res.json();
                if (data.success) {
                    fetchHistory();
                } else {
                    alert('Failed to delete history.');
                }
            } catch (e) {
                alert('Error deleting history.');
            }
        }

        function copyKey(btnElement, textToCopy) {
            let text = textToCopy;
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(showCopied).catch(fallbackCopyTextToClipboard);
            } else {
                fallbackCopyTextToClipboard();
            }

            function fallbackCopyTextToClipboard() {
                let textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                textArea.style.top = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    showCopied();
                } catch (err) {}
                textArea.remove();
            }

            function showCopied() {
                if (btnElement) {
                    const originalHTML = btnElement.innerHTML;
                    btnElement.innerHTML = '<svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> COPIED';
                    btnElement.classList.remove('text-gray-400');
                    btnElement.classList.add('text-emerald-400');
                    setTimeout(() => {
                        btnElement.innerHTML = originalHTML;
                        btnElement.classList.add('text-gray-400');
                        btnElement.classList.remove('text-emerald-400');
                    }, 2000);
                }
            }
        }

        async function fetchHistory() {
            try {
                const res = await fetch('/api/history', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const data = await res.json();
                
                if (data.success) {
                    serverHistory = data.history;
                    renderHistory();
                } else {
                    if(res.status === 401 || res.status === 403) logout();
                }
            } catch(e) {
                document.getElementById('history-list').innerHTML = '<div class="text-center text-red-500">Failed to load history.</div>';
            }
        }

        function renderHistory() {
            const listEl = document.getElementById('history-list');
            
            if (serverHistory.length === 0) {
                listEl.innerHTML = '<div class="text-center text-gray-500 font-bold tracking-widest uppercase p-12 bg-[#0a0a0a] border border-white/5 rounded-2xl">No past orders found.</div>';
                return;
            }

            let history = [...serverHistory];
            
            // Get filter values
            const filterDate = document.getElementById('filter-date').value;
            const sortBy = document.getElementById('sort-by').value;
            const sortOrder = document.getElementById('sort-order').value;

            // Apply Filters
            const now = Date.now();
            const oneDay = 24 * 60 * 60 * 1000;
            const startOfToday = new Date().setHours(0,0,0,0);
            const startOfYesterday = startOfToday - oneDay;

            history = history.filter(item => {
                const ts = item.timestamp || 0; 
                
                if (filterDate === 'all') return true;
                if (filterDate === 'today') return ts >= startOfToday;
                if (filterDate === 'yesterday') return ts >= startOfYesterday && ts < startOfToday;
                if (filterDate === '7days') return (now - ts) <= (7 * oneDay);
                if (filterDate === '30days') return (now - ts) <= (30 * oneDay);
                return true;
            });

            // Apply Sorting
            history.sort((a, b) => {
                let valA, valB;
                
                if (sortBy === 'points') {
                    valA = parseInt(a.points) || 0;
                    valB = parseInt(b.points) || 0;
                } else {
                    valA = a.timestamp || 0;
                    valB = b.timestamp || 0;
                }

                if (sortOrder === 'asc') {
                    return valA > valB ? 1 : (valA < valB ? -1 : 0);
                } else {
                    return valA < valB ? 1 : (valA > valB ? -1 : 0);
                }
            });

            // Render
            if (history.length === 0) {
                listEl.innerHTML = '<div class="text-center text-gray-500 font-bold tracking-widest uppercase p-12 bg-[#0a0a0a] border border-white/5 rounded-2xl">No orders match these filters.</div>';
                return;
            }

            listEl.innerHTML = history.map(item => `
                <div class="bg-[#0a0a0a] border border-white/5 hover:border-white/10 p-6 rounded-2xl flex flex-col md:flex-row gap-6 items-center transition-colors">
                    <div class="flex-grow text-center md:text-left">
                        <div class="text-white font-black text-xl mb-1">${item.name}</div>
                        <div class="text-gray-500 text-xs font-bold tracking-widest uppercase flex flex-wrap gap-3 justify-center md:justify-start">
                            <span>${item.date}</span>
                            <span class="text-white/20">•</span>
                            <span class="text-emerald-500">${item.points ? item.points + ' PTS' : 'Free'}</span>
                            <span class="text-white/20">•</span>
                            <span class="${item.redeemed ? 'text-emerald-400' : 'text-yellow-500'}">${item.redeemed ? 'Delivered' : 'Pending'}</span>
                        </div>
                    </div>
                    
                    <div class="w-full md:w-auto flex flex-col items-center md:items-end gap-2">
                        <span class="text-[10px] text-gray-600 uppercase font-bold tracking-widest">Ticket Reference</span>
                        <div class="flex items-center justify-between gap-3 bg-black/50 border border-white/10 px-4 py-3 rounded-xl w-full md:w-auto overflow-hidden">
                            <code class="text-emerald-400 font-mono text-sm select-all tracking-wider break-all min-w-0">${item.token.slice(-8).toUpperCase()}</code>
                            <div class="flex items-center gap-1">
                                <button onclick="copyKey(this, '${item.token.slice(-8).toUpperCase()}')" class="p-2 bg-white/5 hover:bg-white/10 text-gray-400 hover:text-white rounded-lg transition-colors flex-shrink-0 flex items-center justify-center" title="Copy reference">
                                    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                                </button>
                                ${item.redeemed ? '' : `<a href="${inviteLink}" target="_blank" class="p-2 bg-[#5865F2] hover:bg-[#4752C4] text-white rounded-lg transition-colors flex-shrink-0 flex items-center justify-center" title="Open Discord ticket">
                                    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                                </a>`}
                                <button onclick="deleteOrder('${item.id}')" class="p-2 bg-red-900/20 hover:bg-red-900/50 text-red-500 hover:text-red-300 rounded-lg transition-colors flex-shrink-0 flex items-center justify-center" title="Delete Order">
                                    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                    </div>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchHistory();
        });
    </script>
    <script src="/nav.js"></script>
    <script src="/auth.js"></script>
</body>
</html>
