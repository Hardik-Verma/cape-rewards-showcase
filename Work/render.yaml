services:
  - type: web
    name: cape-rewards-backend
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      # The following should be added securely in the Render Dashboard, not hardcoded here:
      # - DISCORD_TOKEN
      # - DISCORD_CLIENT_ID
      # - DISCORD_GUILD_ID
      # - REWARD_ROLE_ID
      # - BITCOTASKS_SECRET
      # - JWT_SECRET
